<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%">
  <defs>
    <linearGradient id="lykaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1CB8E" />
      <stop offset="45%" stop-color="#C5A869" />
      <stop offset="100%" stop-color="#9E8042" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C5A869" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Architectural Emblem Left -->
  <g transform="translate(10, 10)">
    <!-- Left bent arch pillar -->
    <path d="M 12 185 L 12 55 L 95 10 L 95 62 L 54 85 L 54 185 Z" fill="url(#lykaGoldGrad)" filter="url(#goldGlow)" />
    <!-- Right vertical column -->
    <path d="M 85 85 L 122 108 L 122 185 L 85 185 Z" fill="url(#lykaGoldGrad)" filter="url(#goldGlow)" />
  </g>

  <!-- Lyka Text -->
  <g transform="translate(145, 30)">
    <text x="0" y="125" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="142" font-weight="800" fill="#FFFFFF" letter-spacing="-1" stroke="#E4E4E7" stroke-width="1.5">Lyka</text>
    <!-- Realty Text in Gold -->
    <text x="160" y="195" font-family="'Outfit', 'Inter', Georgia, serif" font-size="62" font-weight="600" fill="url(#lykaGoldGrad)" letter-spacing="2">Realty</text>
  </g>
</svg>
